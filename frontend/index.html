<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIDSTORE</title>
    <link rel="stylesheet" href="./styles.css?v=20260416-cyclemodal">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="kicker">VERSION WEB</p>
          <h1 class="brand-mark">KIDSTORE</h1>
        </div>
        <div class="actions">
          <button id="themeToggle" type="button">Tema claro</button>
          <span id="connectionBadge" class="badge">Sin conectar</span>
          <button id="reloadButton" type="button">Recargar</button>
        </div>
      </header>

      <nav class="top-tabs" role="tablist" aria-label="Secciones del panel">
        <button id="tabControl" class="top-tab active" type="button" role="tab" aria-selected="true">Control</button>
        <button id="tabSpeeches" class="top-tab" type="button" role="tab" aria-selected="false">Cuentas</button>
      </nav>

      <section id="noticeStrip" class="notice-strip" aria-label="Recomendaciones del panel"></section>

      <section class="layout">
        <aside class="panel sidebar">
          <div class="panel-head">
            <h2 id="sidebarTitle">Dispositivos</h2>
          </div>
          <div id="deviceList" class="device-list"></div>
        </aside>

        <section class="panel detail">
          <div id="detailView" class="detail-view"></div>
        </section>
      </section>
    </main>

    <div id="modalRoot"></div>
    <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
      <div class="loading-card">
        <div class="loading-logo-shell">
          <img class="loading-logo" src="./kidstore.png" alt="Kidstore">
        </div>
        <span class="loading-kicker">Panel web de control</span>
        <strong class="loading-title">Cargando Kidstore</strong>
        <p id="loadingStatus" class="loading-status">Preparando dispositivos, tarjetas y datos del panel.</p>
        <div class="loading-bar" aria-hidden="true">
          <span class="loading-bar-fill"></span>
        </div>
      </div>
    </div>

    <script src="./app.js?v=20260416-cyclemodal"></script>
  </body>
</html>
